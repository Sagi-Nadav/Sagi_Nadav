<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>עוזר אישי</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay" class="login-overlay hidden">
  <div class="login-card">
    <div class="login-logo">📅</div>
    <h1>עוזר אישי</h1>
    <p>מזכירה חכמה לניהול יומן, משימות ומיילים</p>
    <a href="/auth/login" class="btn btn-primary btn-large">התחבר עם Microsoft</a>
  </div>
</div>

<!-- Main layout -->
<div id="app" class="app-layout hidden">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">📅</span>
      <span class="sidebar-title">עוזר אישי</span>
    </div>
    <ul class="nav-links">
      <li><a href="#dashboard" class="nav-link" data-view="dashboard">
        <span class="nav-icon">🏠</span> לוח בקרה
      </a></li>
      <li><a href="#calendar" class="nav-link" data-view="calendar">
        <span class="nav-icon">📆</span> יומן
      </a></li>
      <li><a href="#tasks" class="nav-link" data-view="tasks">
        <span class="nav-icon">✅</span> משימות
      </a></li>
      <li><a href="#email" class="nav-link" data-view="email">
        <span class="nav-icon">✉️</span> מיילים
      </a></li>
      <li><a href="#settings" class="nav-link" data-view="settings">
        <span class="nav-icon">⚙️</span> הגדרות
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <div id="user-info" class="user-info"></div>
      <button id="logout-btn" class="btn btn-ghost btn-small">יציאה</button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main-content">
    <div id="view-container"></div>
  </main>

</div>

<!-- Event Modal -->
<div id="event-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="event-modal-title">אירוע חדש</h2>
      <button class="modal-close" id="event-modal-close">✕</button>
    </div>
    <form id="event-form" class="modal-form">
      <input type="hidden" id="event-id" />
      <div class="form-group">
        <label>נושא *</label>
        <input type="text" id="event-subject" required placeholder="נושא האירוע" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>התחלה *</label>
          <input type="datetime-local" id="event-start" required />
        </div>
        <div class="form-group">
          <label>סיום *</label>
          <input type="datetime-local" id="event-end" required />
        </div>
      </div>
      <div class="form-group">
        <label>מיקום</label>
        <input type="text" id="event-location" placeholder="מיקום / קישור פגישה" />
      </div>
      <div class="form-group">
        <label>משתתפים (אחד בכל שורה: שם &lt;email&gt; או email)</label>
        <textarea id="event-attendees" rows="3" placeholder="ישראל ישראלי &lt;israel@example.com&gt;"></textarea>
      </div>
      <div class="form-group">
        <label>תיאור</label>
        <textarea id="event-body" rows="3" placeholder="תיאור האירוע..."></textarea>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="event-online" /> פגישת Teams
      </label>
      <div class="modal-actions">
        <button type="button" id="event-delete-btn" class="btn btn-danger hidden">מחיקה</button>
        <button type="submit" class="btn btn-primary">שמירה</button>
      </div>
    </form>
  </div>
</div>

<!-- Task Modal -->
<div id="task-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="task-modal-title">משימה חדשה</h2>
      <button class="modal-close" id="task-modal-close">✕</button>
    </div>
    <form id="task-form" class="modal-form">
      <input type="hidden" id="task-id" />
      <div class="form-group">
        <label>כותרת *</label>
        <input type="text" id="task-title" required placeholder="מה צריך לעשות?" />
      </div>
      <div class="form-group">
        <label>תיאור</label>
        <textarea id="task-description" rows="3" placeholder="פרטים נוספים..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>עדיפות</label>
          <select id="task-priority">
            <option value="1">🔴 גבוהה</option>
            <option value="2" selected>🟡 בינונית</option>
            <option value="3">🟢 נמוכה</option>
          </select>
        </div>
        <div class="form-group">
          <label>תאריך יעד</label>
          <input type="date" id="task-due-date" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="task-delete-btn" class="btn btn-danger hidden">מחיקה</button>
        <button type="submit" class="btn btn-primary">שמירה</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
