name: Generate Concrete Calculator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Claude Code
        uses: pleaseai/setup-claude-code@v1.1.4

      - name: Generate Calculator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions -p "Build a comprehensive single-file Hebrew RTL reinforced concrete web calculator at concrete-calculator.html implementing IS-413. Include tabs for design calculations, material properties, and code references."

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add concrete-calculator.html
          git diff --cached --quiet || git commit -m "Generate IS-413 concrete calculator"
          git push origin main
